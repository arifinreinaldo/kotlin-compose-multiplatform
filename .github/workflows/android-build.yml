name: Android Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'shared/**'
      - 'androidApp/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'shared/**'
      - 'androidApp/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        build-type: [debug, release]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android ${{ matrix.build-type }}
        run: |
          if [ "${{ matrix.build-type }}" == "debug" ]; then
            ./gradlew :androidApp:assembleDebug --stacktrace
          else
            ./gradlew :androidApp:assembleRelease --stacktrace || echo "Release build not configured"
          fi

      - name: Run Android unit tests
        if: matrix.build-type == 'debug'
        run: ./gradlew :androidApp:testDebugUnitTest --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ matrix.build-type }}
          path: androidApp/build/outputs/apk/${{ matrix.build-type }}/*.apk
          retention-days: 14

      - name: Upload test results
        if: always() && matrix.build-type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: androidApp/build/test-results/testDebugUnitTest/
          retention-days: 7

  instrumented-tests:
    name: Instrumented Tests
    runs-on: macos-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: ./gradlew :androidApp:connectedDebugAndroidTest --stacktrace || echo "No instrumented tests configured"

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: androidApp/build/reports/androidTests/
          retention-days: 7
