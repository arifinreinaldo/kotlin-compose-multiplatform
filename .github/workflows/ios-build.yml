name: iOS Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'shared/**'
      - 'iosApp/**'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-14
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Xcode
        uses: maxim-lobanov@v1
        with:
          xcode-version: '15.2'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build iOS framework
        run: ./gradlew :shared:linkDebugFrameworkIosX64 --stacktrace

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: iosApp/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods dependencies
        if: hashFiles('iosApp/Podfile') != ''
        run: |
          cd iosApp
          pod install

      - name: Build iOS app (Simulator)
        run: |
          xcodebuild             -workspace iosApp/iosApp.xcworkspace             -scheme iosApp             -configuration Debug             -sdk iphonesimulator             -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2'             clean build             CODE_SIGNING_ALLOWED=NO             || echo "iOS build not configured yet"

      - name: Upload iOS build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            iosApp/build/
            shared/build/bin/iosX64/
          retention-days: 7
