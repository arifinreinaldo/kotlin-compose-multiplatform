name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build changelog
        id: changelog
        run: echo "changelog=See CHANGELOG.md for details" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.get_version.outputs.version }}
          body: |
            ## What Changed
            
            ${{ steps.changelog.outputs.changelog }}
            
            ## Downloads
            
            - Android APK
            - Desktop installers (Windows, macOS, Linux)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-release-android:
    name: Build Android Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Android Release
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: androidApp/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-linux:
    name: Build Desktop Linux
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Linux Package
        run: |
          chmod +x gradlew
          ./gradlew :desktopApp:packageDeb --stacktrace

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: desktopApp/build/compose/binaries/main/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-windows:
    name: Build Desktop Windows
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Windows Package
        run: ./gradlew :desktopApp:packageMsi --stacktrace

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: desktopApp/build/compose/binaries/main/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-macos:
    name: Build Desktop macOS
    runs-on: macos-14
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build macOS Package
        run: |
          chmod +x gradlew
          ./gradlew :desktopApp:packageDmg --stacktrace

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: desktopApp/build/compose/binaries/main/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
